services:
  - type: web
    name: well-twin-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: well-twin-db
          property: connectionString
    healthCheckPath: /api/v1/health

databases:
  - name: well-twin-db
    databaseName: well_twin
    user: well_twin_user