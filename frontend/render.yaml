services:
  - type: web
    name: well-twin-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: VITE_ENABLE_DEMO_FALLBACK
        value: false
      - key: VITE_BACKEND_URL
        sync: false